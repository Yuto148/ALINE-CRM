// ============================================================
//  暗号化ユーティリティ（Web Crypto / AES-GCM + PBKDF2）
//  パスワードがないと復号不可能。Googleドライブに置くファイルもこれで暗号化。
// ============================================================
const enc = new TextEncoder();
const dec = new TextDecoder();
const b64 = (buf) => btoa(String.fromCharCode(...new Uint8Array(buf)));
const unb64 = (str) => Uint8Array.from(atob(str), (c) => c.charCodeAt(0));

async function deriveKey(password, salt) {
  const baseKey = await crypto.subtle.importKey("raw", enc.encode(password), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey(
    { name: "PBKDF2", salt, iterations: 250000, hash: "SHA-256" },
    baseKey,
    { name: "AES-GCM", length: 256 },
    false,
    ["encrypt", "decrypt"]
  );
}

// パスワードを暗号化して保存できる形に
async function encryptData(obj, password) {
  const salt = crypto.getRandomValues(new Uint8Array(16));
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const key = await deriveKey(password, salt);
  const ct = await crypto.subtle.encrypt({ name: "AES-GCM", iv }, key, enc.encode(JSON.stringify(obj)));
  return { v: 1, salt: b64(salt), iv: b64(iv), data: b64(ct) };
}

async function decryptData(payload, password) {
  const salt = unb64(payload.salt);
  const iv = unb64(payload.iv);
  const key = await deriveKey(password, salt);
  const pt = await crypto.subtle.decrypt({ name: "AES-GCM", iv }, key, unb64(payload.data));
  return JSON.parse(dec.decode(pt));
}

// パスワード検証用ハッシュ（パスワード自体は保存しない）
async function hashPassword(password, salt) {
  const baseKey = await crypto.subtle.importKey("raw", enc.encode(password), "PBKDF2", false, ["deriveBits"]);
  const bits = await crypto.subtle.deriveBits(
    { name: "PBKDF2", salt, iterations: 250000, hash: "SHA-256" }, baseKey, 256
  );
  return b64(bits);
}

// ============================================================
//  ロック画面（初回パスワード設定 / ログイン / 10分ロック）
// ============================================================
function LockScreen({ mode, onUnlock, onSetup }) {
  const [pw, setPw] = useState("");
  const [pw2, setPw2] = useState("");
  const [err, setErr] = useState("");
  const [shake, setShake] = useState(false);
  const [lockUntil, setLockUntil] = useState(0);
  const [remain, setRemain] = useState(0);

  // ロック残り時間カウントダウン
  useEffect(() => {
    const lk = getLock();
    if (lk.until > Date.now()) setLockUntil(lk.until);
  }, []);
  useEffect(() => {
    if (!lockUntil) return;
    const t = setInterval(() => {
      const r = lockUntil - Date.now();
      if (r <= 0) { setLockUntil(0); setRemain(0); clearLock(); clearInterval(t); }
      else setRemain(r);
    }, 500);
    return () => clearInterval(t);
  }, [lockUntil]);

  const fail = () => { setShake(true); setTimeout(() => setShake(false), 400); };

  const handleSetup = async () => {
    if (pw.length < 6) { setErr("パスワードは6文字以上にしてください"); fail(); return; }
    if (pw !== pw2) { setErr("確認用パスワードが一致しません"); fail(); return; }
    await onSetup(pw);
  };

  const handleLogin = async () => {
    if (lockUntil > Date.now()) return;
    const ok = await onUnlock(pw);
    if (!ok) {
      const lk = getLock();
      const fails = (lk.fails || 0) + 1;
      if (fails >= LOCK_LIMIT) {
        const until = Date.now() + LOCK_MS;
        setLock({ fails: 0, until });
        setLockUntil(until);
        setErr("3回間違えました。10分間ロックします。");
      } else {
        setLock({ fails, until: 0 });
        setErr("パスワードが違います（あと" + (LOCK_LIMIT - fails) + "回でロック）");
      }
      setPw(""); fail();
    }
  };

  const locked = lockUntil > Date.now();
  const mm = Math.floor(remain / 60000);
  const ss = Math.floor((remain % 60000) / 1000);

  return (
    <div style={{ minHeight: "100vh", background: "#1A2E47", display: "flex", alignItems: "center", justifyContent: "center", padding: 20, fontFamily: "'Hiragino Kaku Gothic ProN','Hiragino Sans','Yu Gothic',sans-serif" }}>
      <div className={"fade" + (shake ? " shake" : "")} style={{ width: "100%", maxWidth: 380, background: "#fff", borderRadius: 18, padding: 32 }}>
        <div style={{ textAlign: "center", marginBottom: 24 }}>
          <div style={{ fontSize: 10, letterSpacing: 4, color: "#8A7E68" }}>ALINE STRATEGY &amp; ENGAGEMENT</div>
          <div style={{ fontSize: 30, marginTop: 14, marginBottom: 6 }}>🔒</div>
          <div style={{ fontSize: 19, fontWeight: 800, color: "#1A2E47" }}>{mode === "setup" ? "パスワードを設定" : "顧客管理ダッシュボード"}</div>
          <div style={{ fontSize: 12.5, color: "#8A7E68", marginTop: 6, lineHeight: 1.6 }}>
            {mode === "setup" ? "初回起動です。このツールを開くためのパスワードを決めてください。忘れると復元できません。" : "パスワードを入力してください"}
          </div>
        </div>

        {locked ? (
          <div style={{ textAlign: "center", padding: "20px 0" }}>
            <div style={{ fontSize: 14, color: "#9A3030", fontWeight: 700, marginBottom: 10 }}>🚫 ロック中</div>
            <div style={{ fontSize: 28, fontWeight: 800, color: "#1A2E47", fontVariantNumeric: "tabular-nums" }}>{String(mm).padStart(2, "0")}:{String(ss).padStart(2, "0")}</div>
            <div style={{ fontSize: 12, color: "#8A7E68", marginTop: 8 }}>解除までお待ちください</div>
          </div>
        ) : (
          <div>
            <input className="inp" type="password" placeholder="パスワード" value={pw}
              onChange={(e) => { setPw(e.target.value); setErr(""); }}
              onKeyDown={(e) => { if (e.key === "Enter") { mode === "setup" ? handleSetup() : handleLogin(); } }}
              style={{ marginBottom: 12 }} autoFocus />
            {mode === "setup" && (
              <input className="inp" type="password" placeholder="パスワード（確認）" value={pw2}
                onChange={(e) => { setPw2(e.target.value); setErr(""); }}
                onKeyDown={(e) => { if (e.key === "Enter") handleSetup(); }}
                style={{ marginBottom: 12 }} />
            )}
            {err && <div style={{ fontSize: 12.5, color: "#9A3030", marginBottom: 12, lineHeight: 1.5 }}>{err}</div>}
            <button className="btn" style={{ width: "100%", padding: 15, background: "#1A2E47", color: "#fff", fontSize: 15 }}
              onClick={mode === "setup" ? handleSetup : handleLogin}>
              {mode === "setup" ? "設定して始める" : "ロック解除"}
            </button>
          </div>
        )}

        {mode === "setup" && (
          <div style={{ fontSize: 11, color: "#A89C84", marginTop: 18, lineHeight: 1.6, background: "#FBF9F3", padding: 12, borderRadius: 8 }}>
            ⚠️ パスワードは端末内にのみ保存され、どこにも送信されません。<strong>忘れると保存データを開けなくなります</strong>ので、必ず控えてください。
          </div>
        )}
      </div>
    </div>
  );
}

  const active = useMemo(() => clients.find((c) => c.id === activeId) || null, [clients, activeId]);

  const addClient = (data) => {
    const stage = stageFromFriends(Number(data.friends));
    const nc = { id: uid(), ...data, stage, done: {}, history: [{ date: todayStr(), text: "カルテ作成（STAGE " + stage + " 判定）" }], createdAt: todayStr() };
    persist([nc, ...clients]); setActiveId(nc.id); setView("detail");
  };
  const updateClient = (id, patch, h) => {
    persist(clients.map((c) => {
      if (c.id !== id) return c;
      const u = { ...c, ...patch };
      if (h) u.history = [{ date: todayStr(), text: h }, ...(c.history || [])];
      return u;
    }));
  };
  const deleteClient = (id) => { persist(clients.filter((c) => c.id !== id)); setView("list"); setActiveId(null); };
  const toggleDone = (id, t) => { const c = clients.find((x) => x.id === id); const done = { ...(c.done || {}) }; if (done[t]) delete done[t]; else done[t] = true; updateClient(id, { done }); };
  const advanceStage = (id) => { const c = clients.find((x) => x.id === id); if (!c || c.stage >= 4) return; updateClient(id, { stage: c.stage + 1, done: {} }, "STAGE " + c.stage + " → STAGE " + (c.stage + 1) + " へ進行 🎉"); };
  const regressStage = (id) => { const c = clients.find((x) => x.id === id); if (!c || c.stage <= 1) return; updateClient(id, { stage: c.stage - 1 }, "STAGE " + c.stage + " → STAGE " + (c.stage - 1) + " へ戻す（立て直し）"); };

  // ===== バックアップ書き出し（暗号化ファイル）=====
  const exportBackup = async () => {
    setBusy(true);
    try {
      const payload = await encryptData(clients, password);
      const blob = new Blob([JSON.stringify({ aline_backup: true, exported: new Date().toISOString(), payload })], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      const d = new Date();
      a.href = url;
      a.download = "aline-backup-" + d.getFullYear() + ("0" + (d.getMonth() + 1)).slice(-2) + ("0" + d.getDate()).slice(-2) + ".json";
      a.click();
      URL.revokeObjectURL(url);
    } catch (e) { alert("書き出しに失敗しました"); }
    setBusy(false);
  };

  // ===== バックアップ読み込み（同じパスワードで復号）=====
  const importBackup = async (file) => {
    setBusy(true);
    try {
      const text = await file.text();
      const obj = JSON.parse(text);
      if (!obj.aline_backup || !obj.payload) throw new Error("形式が違います");
      const data = await decryptData(obj.payload, password);
      if (!Array.isArray(data)) throw new Error("データが不正です");
      if (confirm("バックアップを読み込みます。\n現在の" + clients.length + "件を、ファイルの" + data.length + "件で置き換えますか？\n（現在のデータは上書きされます）")) {
        await persist(data);
        alert("読み込みました（" + data.length + "件）");
        setView("list");
      }
    } catch (e) {
      alert("読み込みに失敗しました。\n・別のパスワードで暗号化されたファイルではないですか？\n・正しいバックアップファイルですか？");
    }
    setBusy(false);
    if (fileRef.current) fileRef.current.value = "";
  };

  return (
    <div style={{ minHeight: "100vh", background: "#F4F1EA", color: "#1A2E47", fontFamily: "'Hiragino Kaku Gothic ProN','Hiragino Sans','Yu Gothic',sans-serif" }}>
      <div style={{ background: "#1A2E47", color: "#F4F1EA", padding: "18px 20px" }}>
        <div style={{ maxWidth: 920, margin: "0 auto", display: "flex", justifyContent: "space-between", alignItems: "center", gap: 10 }}>
          <div style={{ cursor: "pointer" }} onClick={() => setView("list")}>
            <div style={{ fontSize: 9, letterSpacing: 3, opacity: 0.6 }}>ALINE STRATEGY &amp; ENGAGEMENT</div>
            <div style={{ fontSize: 19, fontWeight: 800, letterSpacing: 1 }}>LINE運用 顧客管理</div>
          </div>
          <button className="btn" style={{ background: "rgba(255,255,255,.15)", color: "#fff", padding: "8px 14px", fontSize: 12 }} onClick={onLock}>🔒 ロック</button>
        </div>
      </div>

      <div style={{ maxWidth: 920, margin: "0 auto", padding: "20px 16px 60px" }}>
        {view === "list" && (
          <div className="fade">
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 16, flexWrap: "wrap", gap: 10 }}>
              <div style={{ fontSize: 17, fontWeight: 800 }}>顧客一覧 <span style={{ fontSize: 13, color: "#8A7E68", fontWeight: 600 }}>（{clients.length}件）</span></div>
              <button className="btn" style={{ background: "#1A2E47", color: "#fff", padding: "11px 20px", fontSize: 14 }} onClick={() => setView("new")}>＋ 新規カルテ</button>
            </div>

            {/* バックアップ操作 */}
            <div className="card" style={{ marginBottom: 16, padding: 16, background: "#FBF9F3" }}>
              <div style={{ fontSize: 12, fontWeight: 800, color: "#8A7E68", marginBottom: 4 }}>📦 データのバックアップ / 端末間の同期</div>
              <div style={{ fontSize: 11.5, color: "#8A7E68", lineHeight: 1.6, marginBottom: 12 }}>暗号化ファイルとして書き出し→Googleドライブ等に保存。別の端末では「読み込む」で反映できます。中身はパスワードがないと誰も読めません。</div>
              <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
                <button className="btn" disabled={busy} style={{ background: "#5A6B4A", color: "#fff", padding: "10px 16px", fontSize: 13, opacity: busy ? 0.6 : 1 }} onClick={exportBackup}>⬇ 書き出す</button>
                <button className="btn" disabled={busy} style={{ background: "#fff", color: "#5A6B4A", border: "1.5px solid #5A6B4A", padding: "10px 16px", fontSize: 13, opacity: busy ? 0.6 : 1 }} onClick={() => fileRef.current && fileRef.current.click()}>⬆ 読み込む</button>
                <input ref={fileRef} type="file" accept="application/json,.json" style={{ display: "none" }} onChange={(e) => e.target.files[0] && importBackup(e.target.files[0])} />
              </div>
            </div>

            {clients.length > 0 && (
              <div style={{ marginBottom: 14, display: "flex", gap: 7, flexWrap: "wrap" }}>
                {[{ v: "all", l: "すべて" }, { v: "1", l: "STAGE1" }, { v: "2", l: "STAGE2" }, { v: "3", l: "STAGE3" }, { v: "4", l: "STAGE4" }].map((o) => (
                  <button key={o.v} className="btn" onClick={() => setFilter(o.v)} style={{ padding: "6px 13px", fontSize: 12, background: filter === o.v ? "#5A6B4A" : "#fff", color: filter === o.v ? "#fff" : "#5A6B4A", border: "1.5px solid " + (filter === o.v ? "#5A6B4A" : "#C9C2B0") }}>{o.l}</button>
                ))}
              </div>
            )}

            {clients.length === 0 && (
              <div className="card" style={{ textAlign: "center", padding: "44px 20px", color: "#8A7E68" }}>
                <div style={{ fontSize: 15, marginBottom: 8 }}>まだ顧客カルテがありません</div>
                <div style={{ fontSize: 13 }}>「＋ 新規カルテ」から登録するか、バックアップを「読み込む」で復元できます</div>
              </div>
            )}

            <div style={{ display: "grid", gap: 11 }}>
              {clients.filter((c) => filter === "all" || String(c.stage) === filter).map((c) => {
                const a = buildActions(c.industry, c.stage); const all = [...a.grounded, ...a.hypo];
                const dc = all.filter((x) => c.done && c.done[x.t]).length;
                const pct = all.length ? Math.round((dc / all.length) * 100) : 0;
                return (
                  <div key={c.id} className="card" style={{ cursor: "pointer", padding: 17 }} onClick={() => { setActiveId(c.id); setView("detail"); }}>
                    <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", gap: 10 }}>
                      <div style={{ flex: 1 }}>
                        <div style={{ fontSize: 15.5, fontWeight: 800 }}>{c.name || "（無名）"}</div>
                        <div style={{ fontSize: 12, color: "#8A7E68", marginTop: 3 }}>{IND_LABEL[c.industry]}・友だち{c.friends}人</div>
                      </div>
                      <div style={{ background: STAGES[c.stage].color, color: "#fff", padding: "5px 11px", borderRadius: 8, fontSize: 11.5, fontWeight: 700, whiteSpace: "nowrap" }}>STAGE {c.stage}</div>
                    </div>
                    <div style={{ marginTop: 11, display: "flex", alignItems: "center", gap: 10 }}>
                      <div style={{ flex: 1, height: 7, background: "#EFE9DB", borderRadius: 4, overflow: "hidden" }}><div style={{ width: pct + "%", height: "100%", background: STAGES[c.stage].color, transition: "width .4s" }} /></div>
                      <div style={{ fontSize: 11.5, color: "#8A7E68", fontWeight: 700, whiteSpace: "nowrap" }}>{dc}/{all.length}</div>
                    </div>
                  </div>
                );
              })}
            </div>
          </div>
        )}

        {view === "new" && <NewClientForm onCancel={() => setView("list")} onSubmit={addClient} />}
        {view === "detail" && active && (
          <ClientDetail c={active} onBack={() => setView("list")} onAdvance={() => advanceStage(active.id)} onRegress={() => regressStage(active.id)} onToggle={(t) => toggleDone(active.id, t)} onUpdate={(p, h) => updateClient(active.id, p, h)} onDelete={() => { if (confirm("このカルテを削除しますか？")) deleteClient(active.id); }} />
        )}
      </div>
    </div>
  );
}

  const [name, setName] = useState(""); const [industry, setIndustry] = useState(""); const [friends, setFriends] = useState("");
  const [freq, setFreq] = useState(""); const [goal, setGoal] = useState(""); const [repeat, setRepeat] = useState(""); const [block, setBlock] = useState(""); const [capacity, setCapacity] = useState("");
  const ok = name && industry && friends !== "" && freq && goal && capacity;
  return (
    <div className="card fade">
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 20 }}>
        <div style={{ fontSize: 18, fontWeight: 800 }}>新規カルテ作成</div>
        <button className="btn" style={{ background: "#EFE9DB", color: "#8A7E68", padding: "8px 16px", fontSize: 13 }} onClick={onCancel}>キャンセル</button>
      </div>
      <label className="lbl">店舗・クライアント名</label>
      <input className="inp" placeholder="例：富山中央整体院" value={name} onChange={(e) => setName(e.target.value)} style={{ marginBottom: 22 }} />
      <label className="lbl">業種</label>
      <div className="g4" style={{ display: "grid", gridTemplateColumns: "repeat(4,1fr)", gap: 9, marginBottom: 22 }}>
        {INDUSTRIES.map((it) => <button key={it.id} className={"opt" + (industry === it.id ? " on" : "")} onClick={() => setIndustry(it.id)}><span className="n">{it.icon}</span>{it.label}</button>)}
      </div>
      <label className="lbl">現在の友だち数</label>
      <input className="inp" type="number" inputMode="numeric" placeholder="例：120" value={friends} onChange={(e) => setFriends(e.target.value)} style={{ marginBottom: 22 }} />
      <label className="lbl">配信頻度</label>
      <div className="g4" style={{ display: "grid", gridTemplateColumns: "repeat(4,1fr)", gap: 9, marginBottom: 22 }}>
        {[{ v: "none", l: "配信なし" }, { v: "weekly", l: "週1〜2回" }, { v: "few", l: "月数回" }, { v: "daily", l: "ほぼ毎日" }].map((o) => <button key={o.v} className={"opt" + (freq === o.v ? " on" : "")} onClick={() => setFreq(o.v)}>{o.l}</button>)}
      </div>
      <label className="lbl">一番の目標</label>
      <div className="g4" style={{ display: "grid", gridTemplateColumns: "repeat(4,1fr)", gap: 9, marginBottom: 22 }}>
        {[{ v: "newcustomer", l: "新規客" }, { v: "repeat", l: "リピート率" }, { v: "ltv", l: "客単価・LTV" }, { v: "efficiency", l: "業務効率化" }].map((o) => <button key={o.v} className={"opt" + (goal === o.v ? " on" : "")} onClick={() => setGoal(o.v)}>{o.l}</button>)}
      </div>
      <div className="g2" style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 16, marginBottom: 22 }}>
        <div><label className="lbl">リピート率（任意・%）</label><input className="inp" type="number" inputMode="numeric" placeholder="例：30" value={repeat} onChange={(e) => setRepeat(e.target.value)} /></div>
        <div><label className="lbl">ブロック率（任意・%）</label><input className="inp" type="number" inputMode="numeric" placeholder="例：12" value={block} onChange={(e) => setBlock(e.target.value)} /></div>
      </div>
      <label className="lbl">運用に割ける体制</label>
      <div className="g3" style={{ display: "grid", gridTemplateColumns: "repeat(3,1fr)", gap: 9, marginBottom: 26 }}>
        {[{ v: "low", l: "ほぼ取れない" }, { v: "mid", l: "週数時間" }, { v: "high", l: "しっかり" }].map((o) => <button key={o.v} className={"opt" + (capacity === o.v ? " on" : "")} onClick={() => setCapacity(o.v)}>{o.l}</button>)}
      </div>
      <button className="btn" disabled={!ok} style={{ width: "100%", padding: 17, background: ok ? "#1A2E47" : "#C9C2B0", color: "#fff", fontSize: 16, opacity: ok ? 1 : 0.6, cursor: ok ? "pointer" : "not-allowed" }} onClick={() => ok && onSubmit({ name, industry, friends, freq, goal, repeat, block, capacity })}>カルテを作成して提案を見る →</button>
    </div>
  );
}

// ---- 詳細 ----
function ClientDetail({ c, onBack, onAdvance, onRegress, onToggle, onUpdate, onDelete }) {
  const [tab, setTab] = useState("plan");
  const biz = BIZ[c.industry]; const { grounded, hypo } = buildActions(c.industry, c.stage);
  const warnings = buildWarnings(c); const all = [...grounded, ...hypo];
  const dc = all.filter((a) => c.done && c.done[a.t]).length; const pct = all.length ? Math.round((dc / all.length) * 100) : 0;
  const exitItems = STAGE_EXIT[c.stage] || []; const usedLevers = [...new Set(all.map((a) => a.p))].map((k) => PSY[k]).filter(Boolean);

  const ActionCard = ({ a, grounded }) => {
    const ch = c.done && c.done[a.t];
    return (
      <div className="card" style={{ borderLeft: "4px solid " + (grounded ? "#2D4A6E" : "#B89A4A"), background: grounded ? "#fff" : "#FEFCF7", marginBottom: 12, padding: 17, opacity: ch ? 0.6 : 1 }}>
        <div style={{ display: "flex", gap: 12 }}>
          <button onClick={() => onToggle(a.t)} className="btn" style={{ width: 26, height: 26, borderRadius: 7, flexShrink: 0, marginTop: 2, background: ch ? "#5A6B4A" : "#fff", border: "2px solid " + (ch ? "#5A6B4A" : "#C9C2B0"), color: "#fff", fontSize: 14, lineHeight: 1, padding: 0 }}>{ch ? "✓" : ""}</button>
          <div style={{ flex: 1 }}>
            {a.p && PSY[a.p] && <div className="psy">🧠 {PSY[a.p].name}</div>}
            <div style={{ fontWeight: 800, fontSize: 14.5, marginBottom: 5, textDecoration: ch ? "line-through" : "none" }}>{a.t}</div>
            <div style={{ fontSize: 13, lineHeight: 1.7, color: "#3A4A5E" }}>{a.d}</div>
            <div className="why">{grounded ? "📌 根拠：" : "💡 仮説："}{a.w}</div>
          </div>
        </div>
      </div>
    );
  };

  return (
    <div className="fade">
      <button className="btn" style={{ background: "transparent", color: "#8A7E68", padding: "6px 0", fontSize: 13, marginBottom: 12 }} onClick={onBack}>← 顧客一覧へ</button>
      <div className="card" style={{ background: STAGES[c.stage].color, color: "#fff", border: "none", marginBottom: 14 }}>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", flexWrap: "wrap", gap: 10 }}>
          <div><div style={{ fontSize: 20, fontWeight: 800 }}>{c.name}</div><div style={{ fontSize: 13, opacity: 0.85, marginTop: 3 }}>{IND_LABEL[c.industry]}・友だち{c.friends}人</div></div>
          <div style={{ textAlign: "right" }}><div style={{ fontSize: 12, opacity: 0.7 }}>{STAGES[c.stage].name}</div><div style={{ fontSize: 12, opacity: 0.7 }}>{STAGES[c.stage].range}</div></div>
        </div>
        <div style={{ fontSize: 13, marginTop: 12, opacity: 0.95, lineHeight: 1.6 }}>🎯 {STAGES[c.stage].goal}</div>
        <div style={{ marginTop: 14, display: "flex", alignItems: "center", gap: 10 }}>
          <div style={{ flex: 1, height: 8, background: "rgba(255,255,255,.25)", borderRadius: 4, overflow: "hidden" }}><div style={{ width: pct + "%", height: "100%", background: "#fff", transition: "width .4s" }} /></div>
          <div style={{ fontSize: 12.5, fontWeight: 700 }}>施策 {dc}/{all.length}（{pct}%）</div>
        </div>
      </div>

      <div style={{ display: "flex", gap: 6, marginBottom: 14, flexWrap: "wrap" }}>
        {[{ v: "plan", l: "施策プラン" }, { v: "exit", l: "次ステージ条件" }, { v: "history", l: "履歴" }, { v: "edit", l: "数値を更新" }].map((t) => (
          <button key={t.v} className="btn" onClick={() => setTab(t.v)} style={{ padding: "9px 15px", fontSize: 13, background: tab === t.v ? "#1A2E47" : "#fff", color: tab === t.v ? "#fff" : "#3A4A5E", border: "1.5px solid " + (tab === t.v ? "#1A2E47" : "#C9C2B0") }}>{t.l}</button>
        ))}
      </div>

      {warnings.map((w, i) => (
        <div key={i} style={{ background: w.level === "danger" ? "#FBEAEA" : w.level === "warn" ? "#FFF4E5" : "#EAF1F8", border: "1px solid " + (w.level === "danger" ? "#E0A3A3" : w.level === "warn" ? "#E8C99A" : "#A8C2E0"), borderRadius: 10, padding: 13, marginBottom: 10, fontSize: 13, lineHeight: 1.6, color: w.level === "danger" ? "#9A3030" : w.level === "warn" ? "#8A5A10" : "#2D4A6E" }}>
          {w.level === "danger" ? "🚨 " : w.level === "warn" ? "⚠️ " : "ℹ️ "}{w.text}
        </div>
      ))}

      {tab === "plan" && (
        <div>
          <div className="card" style={{ marginBottom: 14, background: "#FBF9F3" }}>
            <div style={{ fontSize: 12, fontWeight: 800, letterSpacing: 1, color: "#8A7E68", marginBottom: 9 }}>▍この業種の『商売の構造』</div>
            <div style={{ fontSize: 13.5, lineHeight: 1.8, color: "#3A4A5E", marginBottom: 10 }}>{biz.insight}</div>
            <div className="g2" style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 7, fontSize: 12 }}>
              <div><strong style={{ color: "#8A7E68" }}>来店周期：</strong>{biz.cycle}</div><div><strong style={{ color: "#8A7E68" }}>意思決定：</strong>{biz.decision}</div>
              <div><strong style={{ color: "#8A7E68" }}>単価特性：</strong>{biz.price}</div><div><strong style={{ color: "#8A7E68" }}>LINEの役割：</strong>{biz.lineRole}</div>
            </div>
          </div>
          {grounded.length > 0 && <div style={{ fontSize: 14, fontWeight: 800, margin: "4px 0 10px" }}>実績の裏付けがある施策 <span style={{ fontSize: 11, color: "#5A6B4A", background: "#E8EDE0", padding: "2px 9px", borderRadius: 5 }}>根拠あり</span></div>}
          {grounded.map((a, i) => <ActionCard key={i} a={a} grounded />)}
          {hypo.length > 0 && <div style={{ fontSize: 14, fontWeight: 800, margin: "16px 0 10px" }}>コンサル視点の追加施策 <span style={{ fontSize: 11, color: "#8A6D2A", background: "#EFE6D8", padding: "2px 9px", borderRadius: 5 }}>仮説</span></div>}
          {hypo.map((a, i) => <ActionCard key={i} a={a} />)}
          {usedLevers.length > 0 && (
            <div className="card" style={{ marginTop: 14, background: "#FBF9F3" }}>
              <div style={{ fontSize: 12.5, fontWeight: 800, marginBottom: 10 }}>▍使っている心理学レバー</div>
              {usedLevers.map((l, i) => <div key={i} style={{ fontSize: 12.5, lineHeight: 1.6, marginBottom: 7, paddingBottom: 7, borderBottom: i < usedLevers.length - 1 ? "1px solid #EFE9DB" : "none" }}><strong style={{ color: "#8A6D2A" }}>{l.name}</strong>：{l.desc}</div>)}
            </div>
          )}
        </div>
      )}

      {tab === "exit" && (
        <div>
          {c.stage < 4 ? (
            <div className="card" style={{ marginBottom: 14 }}>
              <div style={{ fontSize: 14, fontWeight: 800, marginBottom: 6 }}>STAGE {c.stage} → STAGE {c.stage + 1} への卒業条件</div>
              <div style={{ fontSize: 12.5, color: "#8A7E68", marginBottom: 16, lineHeight: 1.6 }}>これらを満たしたら「次のステージへ進む」を押してください。次ステージの新しい施策が表示されます。</div>
              {exitItems.map((e, i) => (
                <div key={i} style={{ display: "flex", gap: 10, alignItems: "flex-start", padding: "10px 0", borderBottom: i < exitItems.length - 1 ? "1px solid #EFE9DB" : "none" }}>
                  <div style={{ color: "#5A6B4A", fontWeight: 800, fontSize: 15 }}>{i + 1}.</div><div style={{ fontSize: 13.5, lineHeight: 1.6 }}>{e}</div>
                </div>
              ))}
            </div>
          ) : (
            <div className="card" style={{ marginBottom: 14, textAlign: "center", padding: "30px 20px" }}>
              <div style={{ fontSize: 15, fontWeight: 800, marginBottom: 6 }}>🎉 最終ステージに到達しています</div>
              <div style={{ fontSize: 13, color: "#8A7E68", lineHeight: 1.6 }}>動画・LP制作などサービス拡張（アップセル）の提案フェーズです。</div>
            </div>
          )}
          {c.stage < 4 && (
            <div className="card" style={{ marginBottom: 14, background: STAGES[c.stage + 1].color, color: "#fff", border: "none" }}>
              <div style={{ fontSize: 11, opacity: 0.7, letterSpacing: 1 }}>次のステージ</div>
              <div style={{ fontSize: 17, fontWeight: 800, marginTop: 3 }}>{STAGES[c.stage + 1].name}</div>
              <div style={{ fontSize: 13, opacity: 0.9, marginTop: 6, lineHeight: 1.6 }}>🎯 {STAGES[c.stage + 1].goal}</div>
            </div>
          )}
          <div style={{ display: "flex", gap: 10, flexWrap: "wrap" }}>
            {c.stage < 4 && <button className="btn" style={{ flex: 1, minWidth: 200, padding: 16, background: "#5A6B4A", color: "#fff", fontSize: 15 }} onClick={onAdvance}>✓ 次のステージへ進む（STAGE {c.stage + 1}）→</button>}
            {c.stage > 1 && <button className="btn" style={{ padding: 16, background: "#fff", color: "#9A6030", border: "1.5px solid #E0B080", fontSize: 13 }} onClick={onRegress}>← 前のステージに戻す</button>}
          </div>
        </div>
      )}

      {tab === "history" && (
        <div className="card">
          <div style={{ fontSize: 14, fontWeight: 800, marginBottom: 14 }}>アクティビティ履歴</div>
          {(c.history || []).map((h, i) => (
            <div key={i} style={{ display: "flex", gap: 12, padding: "11px 0", borderBottom: i < c.history.length - 1 ? "1px solid #EFE9DB" : "none" }}>
              <div style={{ fontSize: 11.5, color: "#A89C84", whiteSpace: "nowrap", paddingTop: 2, minWidth: 88 }}>{h.date}</div><div style={{ fontSize: 13.5, lineHeight: 1.5 }}>{h.text}</div>
            </div>
          ))}
        </div>
      )}

      {tab === "edit" && <EditPanel c={c} onUpdate={onUpdate} onDelete={onDelete} />}
    </div>
  );
}

function EditPanel({ c, onUpdate, onDelete }) {
  const [friends, setFriends] = useState(c.friends); const [freq, setFreq] = useState(c.freq); const [repeat, setRepeat] = useState(c.repeat || ""); const [block, setBlock] = useState(c.block || "");
  const save = () => {
    const patch = { friends, freq, repeat, block }; const os = c.stage; const ns = stageFromFriends(Number(friends));
    let h = "数値を更新（友だち" + friends + "人）"; if (ns !== os) { patch.stage = ns; h += " / 友だち数に応じ STAGE " + os + "→" + ns + " に自動調整"; }
    onUpdate(patch, h); alert("更新しました");
  };
  return (
    <div className="card">
      <div style={{ fontSize: 14, fontWeight: 800, marginBottom: 16 }}>最新の数値に更新</div>
      <div style={{ fontSize: 12, color: "#8A7E68", marginBottom: 18, lineHeight: 1.6 }}>運用が進んだら数値を更新しましょう。友だち数を変えるとステージも自動で見直されます。</div>
      <label className="lbl">友だち数</label>
      <input className="inp" type="number" inputMode="numeric" value={friends} onChange={(e) => setFriends(e.target.value)} style={{ marginBottom: 18 }} />
      <label className="lbl">配信頻度</label>
      <div className="g4" style={{ display: "grid", gridTemplateColumns: "repeat(4,1fr)", gap: 9, marginBottom: 18 }}>
        {[{ v: "none", l: "配信なし" }, { v: "weekly", l: "週1〜2回" }, { v: "few", l: "月数回" }, { v: "daily", l: "ほぼ毎日" }].map((o) => <button key={o.v} className={"opt" + (freq === o.v ? " on" : "")} onClick={() => setFreq(o.v)}>{o.l}</button>)}
      </div>
      <div className="g2" style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 16, marginBottom: 24 }}>
        <div><label className="lbl">リピート率（%）</label><input className="inp" type="number" inputMode="numeric" value={repeat} onChange={(e) => setRepeat(e.target.value)} /></div>
        <div><label className="lbl">ブロック率（%）</label><input className="inp" type="number" inputMode="numeric" value={block} onChange={(e) => setBlock(e.target.value)} /></div>
      </div>
      <button className="btn" style={{ width: "100%", padding: 15, background: "#1A2E47", color: "#fff", fontSize: 15, marginBottom: 12 }} onClick={save}>更新を保存</button>
      <button className="btn" style={{ width: "100%", padding: 12, background: "transparent", color: "#C08080", fontSize: 12.5, border: "1px solid #E0B0B0" }} onClick={onDelete}>このカルテを削除</button>
    </div>
  );
}

// ============================================================
//  ルート：認証フロー
// ============================================================
function App() {
  const [stage, setStage] = useState("loading"); // loading | setup | login | app
  const [password, setPassword] = useState(null);

  useEffect(() => {
    const auth = localStorage.getItem(LS_AUTH);
    setStage(auth ? "login" : "setup");
  }, []);

  const handleSetup = async (pw) => {
    const salt = crypto.getRandomValues(new Uint8Array(16));
    const hash = await hashPassword(pw, salt);
    localStorage.setItem(LS_AUTH, JSON.stringify({ salt: b64(salt), hash }));
    setPassword(pw); clearLock(); setStage("app");
  };

  const handleUnlock = async (pw) => {
    try {
      const auth = JSON.parse(localStorage.getItem(LS_AUTH));
      const hash = await hashPassword(pw, unb64(auth.salt));
      if (hash === auth.hash) { setPassword(pw); clearLock(); setStage("app"); return true; }
      return false;
    } catch (e) { return false; }
  };

  const lock = () => { setPassword(null); setStage("login"); };

  if (stage === "loading") return <div style={{ minHeight: "100vh", background: "#1A2E47" }} />;
  if (stage === "setup") return <LockScreen mode="setup" onSetup={handleSetup} />;
  if (stage === "login") return <LockScreen mode="login" onUnlock={handleUnlock} />;
  return <Dashboard password={password} onLock={lock} />;
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
